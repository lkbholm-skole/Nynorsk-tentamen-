<!DOCTYPE html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nynorskhelten Ultra Complete</title><style>body{margin:0;font-family:Segoe UI;background:linear-gradient(135deg,#064e3b,#1e3a8a);color:#fff} .wrap{max-width:1100px;margin:auto;padding:20px;text-align:center}.panel,.card{background:rgba(255,255,255,.12);border-radius:18px;padding:16px}.card{margin-top:18px}.bar{height:22px;background:#334155;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,gold,lime);width:0%} textarea,input{width:90%;padding:10px;font-size:18px} button{padding:12px 20px;border:none;border-radius:10px;background:#22c55e;color:#fff;font-size:18px}.boss{height:18px;background:#444;border-radius:20px;overflow:hidden}.bossfill{height:100%;background:red;width:100%}</style></head><body><div class='wrap'><h1>👑 NYNORSKHELTEN ULTRA</h1><div class='panel'>❤️ <span id=lives>5</span> | ⭐ <span id=xp>0</span> | 🪙 <span id=coins>0</span> | ✅ <span id=score>0</span> | 🏅 <span id=rank>Rekrutt</span></div><br><div class='bar'><div id=prog class='fill'></div></div><h2 id=world></h2><div id='bossArea' style='display:none'><p>👹 Bokmålskongen</p><div class='boss'><div id='bossHp' class='bossfill'></div></div></div><div class='card'><div id='content'></div><br><textarea id='answer' rows='4'></textarea><br><br><button onclick='checkAnswer()'>Svar</button><div id='feedback'></div></div></div><script>let lives=5,xp=0,coins=0,score=0,boss=10,index=0;const tasks=[{w:'📖 Ordmeister',q:'Skriv på nynorsk: jeg',a:['eg']},{w:'📖 Ordmeister',q:'Skriv på nynorsk: hvorfor',a:['kvifor']},{w:'⚔️ Verbmeister',q:'Preteritum av å gå',a:['gjekk']},{w:'⚔️ Verbmeister',q:'Preteritum av å skrive',a:['skreiv']},{w:'🏰 Setningsbyggjar',q:'Skriv på nynorsk: Vi skal hjem',a:['vi skal heim']},{w:'🏰 Setningsbyggjar',q:'Skriv på nynorsk: Jeg liker håndball',a:['eg likar handball']},{w:'📖 Lesetekst',text:'Emma spelte handball etter skulen. Ho kom heim klokka seks og gjorde lekser.',q:'Kva gjorde Emma etter skulen?',a:['handball','spelte handball']},{w:'📖 Lesetekst',text:'Ali syklar til trening kvar tysdag.',q:'Korleis kjem Ali til trening?',a:['syklar','sykkel']},{w:'✍️ Skriveoppdrag',write:true,q:'Skriv minst to setningar om ein hobby på nynorsk.'},{w:'✍️ Skriveoppdrag',write:true,q:'Forklar kvifor fysisk aktivitet er viktig.'},{w:'📖 Lesetekst',text:'Familien reiste til fjells og gjekk lange turar.',q:'Kvar reiste familien?',a:['fjells','til fjells']},{w:'✍️ Skriveoppdrag',write:true,q:'Skriv ei melding til ein ven på nynorsk.'},{w:'👑 Boss',q:'Skriv på nynorsk: ikke',a:['ikkje']},{w:'👑 Boss',q:'Skriv på nynorsk: nå',a:['no']}];function clean(s){return s.toLowerCase().trim().replace(/[.!?,]/g,'');}function save(){localStorage.setItem('nyUltra',JSON.stringify({lives,xp,coins,score,boss,index}));}function load(){let d=localStorage.getItem('nyUltra');if(d){d=JSON.parse(d);Object.assign(window,d);lives=d.lives;xp=d.xp;coins=d.coins;score=d.score;boss=d.boss;index=d.index;}}function rank(){if(xp>1200)return 'Tentamenmeister';if(xp>800)return 'Nynorskhelt';if(xp>400)return 'Språkkrigar';if(xp>200)return 'Ordmeister';return 'Rekrutt';}function render(){if(index>=tasks.length&&boss<=0)return win();let t=tasks[Math.min(index,tasks.length-1)];world.innerText=t.w;if(index>=12)bossArea.style.display='block';content.innerHTML=(t.text?'<p>'+t.text+'</p><hr>':'')+'<h3>'+t.q+'</h3>';answer.value='';update();}function update(){livesEl.textContent=lives;xpEl.textContent=xp;coinsEl.textContent=coins;scoreEl.textContent=score;rankEl.textContent=rank();prog.style.width=Math.min((index/tasks.length)*100,100)+'%';bossHp.style.width=(boss/10*100)+'%';}const livesEl=lives,xpEl=document.getElementById('xp'),coinsEl=document.getElementById('coins'),scoreEl=document.getElementById('score'),rankEl=document.getElementById('rank');function checkpoint(){return index<4?1:index<8?2:index<12?3:4;}function resumeFromCheckpoint(){lives=5;index=checkpoint()*4-4;document.location.reload()}function checkAnswer(){let t=tasks[Math.min(index,tasks.length-1)];let a=clean(answer.value);let ok=false;if(t.write){ok=a.split(' ').length>=6}else{ok=t.a.some(x=>a.includes(clean(x)))}if(ok){score++;xp+=100;coins+=15;feedback.innerHTML='✅ Riktig!';if(score==5)feedback.innerHTML='💰 Du vann 10 kr!';if(score==8)feedback.innerHTML='💵 Du vann 15 kr!';if(index>=12&&boss>0)boss--;index++;}else{lives--;feedback.innerHTML='❌ Prøv igjen. Liv igjen: '+lives;if(lives<=0){save();document.querySelector('.card').innerHTML='<h2>💾 Lagringspunkt</h2><p>Du nådde verd '+checkpoint()+'</p><button onclick="localStorage.removeItem('nyUltra');location.reload()">Start på nytt</button><button onclick="location.reload()">Fortsett frå lagring</button>';return;}}save();render()}function win(){localStorage.removeItem('nyUltra');document.body.innerHTML='<div style="padding:40px;color:white;text-align:center"><h1>🏆 NYNORSKHELTEN</h1><h2>Du er tentamenklar!</h2><h2>💰 Totalt 25 kroner</h2><h2>⭐ XP '+xp+'</h2><h2>🪙 '+coins+' mynter</h2><h2>👑 Bokmålskongen er slått!</h2></div>';}load();render();</script></body></html>
